# Min Code Agent — 完整配置示例
#
# 使用方式：
#   cp mincode.example.yaml mincode.yaml
#   # 再按需修改（API Key 建议只用环境变量，不要写进文件提交）
#
# 查找顺序（未指定 --config 时）：
#   <workspace>/mincode.yaml
#   <workspace>/mincode.yml
#   ./mincode.yaml
#   ./mincode.yml
#
# 环境变量优先于本文件（见各字段注释中的 ENV 名）。
# 未写出的字段会使用内置默认值（见 internal/config.Default / normalize）。

# ---------------------------------------------------------------------------
# provider：LLM 后端（核心 Runtime 只依赖内部 Provider 接口，可替换）
# ---------------------------------------------------------------------------
provider:
  # 后端类型。
  #   openai-compatible — 任意 OpenAI 兼容 /v1/chat/completions
  #   fake              — 离线脚本，测试 / 演示用，不访问网络
  # ENV: MINCODE_PROVIDER_TYPE
  # 默认: openai-compatible
  type: openai-compatible

  # OpenAI 兼容 API 根地址（不含最后的 /chat/completions）。
  # 例：https://api.openai.com/v1
  #     https://api.deepseek.com/v1
  #     http://127.0.0.1:11434/v1   (Ollama 等本地服务，需兼容协议)
  # ENV: MINCODE_BASE_URL
  # 默认: https://api.openai.com/v1
  base_url: https://api.deepseek.com/v1

  # API Key。强烈建议不写在此文件，改用环境变量：
  #   MINCODE_API_KEY  或  OPENAI_API_KEY
  # 两者都设置时优先 MINCODE_API_KEY。
  # 默认: 空（openai-compatible 下为空会报 ErrNoAPIKey）
  # api_key: sk-...

  # 模型名，原样传给 API 的 model 字段。
  # ENV: MINCODE_MODEL 或 OPENAI_MODEL（前者优先）
  # 默认: gpt-4o-mini
  model: deepseek-chat

  # 采样温度。默认: 0.7
  temperature: 0.7

  # completion 最大 token（传给 API max_tokens）。0 表示不发送该字段。
  # ENV: MINCODE_MAX_TOKENS（仅当 >0 时覆盖）
  # 默认: 0（不限制，由服务商决定）
  max_tokens: 0

  # 单次 HTTP 请求超时（秒）。默认: 120
  timeout_sec: 120

  # 是否启用流式输出（OpenAI 兼容 SSE stream=true）。
  #   true  — 边生成边展示（CLI/Web）；事件 llm.stream_*
  #   false — 非流式，整段一次返回（旧路径仍保留）
  # 不支持流式的 Provider 会自动回退非流式。
  # 默认: true
  stream: true

# ---------------------------------------------------------------------------
# agent：Agent Loop、Context、并行工具
# ---------------------------------------------------------------------------
agent:
  # 单次用户输入最多执行多少个「LLM↔Tool」循环步。
  # 超过后返回 MaxStepsExceeded。默认: 30
  max_steps: 30

  # 每次 LLM 调用的估算 prompt token 上限（含 system/instructions/tools schema 等）。
  # 超预算时 Context Manager 会裁剪（排除/截断历史等）。
  # 默认: 32000
  token_budget: 32000

  # 历史压缩阈值（估算 token）。
  #   0  → 使用默认 18000
  #   <0 → 禁用压缩
  # 压缩后可在 /context 或 Trace 中看到 before/after/compressed 等。
  # 默认: 18000
  compress_at: 18000

  # 一次 LLM 响应里连续的只读工具（read_file/list_dir/glob/grep）是否并行执行。
  # write_file/edit_file/shell 与未知工具始终串行；需要交互审批的调用回退串行。
  # 默认: true
  parallel_tools: true

  # 并行只读工具的并发上限。默认: 4
  max_parallel: 4

  # 自省（Reflection）：**用过工具的回合**在最终回答前自审一次，
  # 发现问题则继续迭代。纯对话 / 创作类回合（未用工具）不触发，避免干扰
  # 严格格式输出、也省一次调用。
  # 事件: reflection.started / reflection.finished（含 verdict/issue_count）。
  # 默认: false
  reflection: false

  # 单回合最多自省次数（达到上限后接受当前回答，避免死循环）。默认: 2
  max_reflections: 2

  # Repository Map：把工作区结构（文件路径 + Go 顶层符号）作为 pinned 上下文
  # 注入，帮助模型先定位再读取，减少盲目 glob/grep/read。启动时构建一次，
  # 模型也可调用 repo_map 工具按子目录/关键词刷新。
  # 事件: repo_map.built（files/symbols/tokens/truncated/build_ms）。
  #   true  — 默认启用
  #   false — 不注入，且不注册 repo_map 工具
  # 默认: true
  repo_map: true

  # 注入的 Repository Map 预算（估算 token，超预算按结构相关度截断）。
  # 默认: 1500
  repo_map_tokens: 1500

  # 自定义 System Prompt。留空则使用内置 DefaultSystemPrompt
  #（并会附加平台相关 shell 提示：Windows/cmd vs Unix/sh）。
  # 填写后将**完全替换**内置提示词，需要时请自行写全工具与安全说明。
  # 默认: "" → 内置提示词
  # system_prompt: |
  #   You are Min Code Agent, ...

# ---------------------------------------------------------------------------
# data：运行时数据（traces / sessions / experiments）存放位置
# ---------------------------------------------------------------------------
# 三类数据统一由 data.location 决定，无单独的 trace.dir 等覆盖项。
data:
  # global   — {user_home}/.mincode/projects/{project-id}/
  #            {traces,sessions,experiments} 都在该 project 目录下
  #            project-id = {目录名 slug}-{SHA256(规范化绝对路径) 前8位}
  # workspace — {workspace}/.mincode/{traces,sessions,experiments}
  # ENV: MINCODE_DATA_LOCATION
  # 默认: global
  location: global

  # 全局数据根目录（仅 location=global 时使用）。
  # ENV: MINCODE_DATA_ROOT
  # 默认: {user_home}/.mincode
  # root: D:\data\mincode

# ---------------------------------------------------------------------------
# memory：跨会话记忆（workspace/MEMORY.md — 仍跟项目走，不进 global）
# ---------------------------------------------------------------------------
memory:
  # 成功回合结束后，是否可选地让 LLM 提炼一条可持久事实（仍需用户批准）。
  # 工具 memory_add 始终可由模型调用（策略默认 Ask）。
  # 默认: false
  auto_extract: false

# ---------------------------------------------------------------------------
# websearch：Web 搜索工具（web_search，只读网络查询）
# ---------------------------------------------------------------------------
websearch:
  # 搜索后端类型。
  #   ""       — 禁用（不注册 web_search 工具）
  #   fake     — 离线脚本结果，测试 / 演示用，不访问网络
  #   tavily   — 真实 HTTP 搜索（Tavily /search API，需要 api_key）
  #   searxng  — 自托管 SearxNG 实例（需要 base_url，无需 api_key；
  #              实例需在 settings.yml 的 search.formats 中启用 json）
  # ENV: MINCODE_WEBSEARCH_TYPE
  # 默认: ""（禁用）
  type: ""

  # API Key（仅 type=tavily 必填）。建议改用环境变量 MINCODE_WEBSEARCH_API_KEY。
  # 默认: 空
  # api_key: tvly-...

  # 后端根地址。
  #   type=tavily  可选；留空用默认 https://api.tavily.com。
  #   type=searxng 必填；例如 http://localhost:8080。
  # ENV: MINCODE_WEBSEARCH_BASE_URL
  # 默认: 空
  # base_url: http://localhost:8080

  # 每次搜索返回条数的默认上限（模型可用 max_results 覆盖，硬上限 10）。
  # 0 表示使用工具默认 5。
  # 默认: 0
  max_results: 0

  # 单次搜索超时（秒）。0 表示使用工具默认 20。
  # 默认: 0
  timeout_sec: 0

# ---------------------------------------------------------------------------
# codesearch：查询相关度检索（code_search 工具 + 每轮自动注入 top-K）
# ---------------------------------------------------------------------------
codesearch:
  # 是否启用。true 时：
  #   - 注册 code_search 工具（只读、可并行）
  #   - 每轮开始按用户输入做一次词法检索，把 top-K 作为 pinned 上下文注入
  #     （source=code_search，事件 code_search.injected）
  # 默认: true
  enabled: true

  # 检索后端。
  #   lexical — 基于路径/包名/符号名/签名的 BM25（零依赖、确定性、可解释）
  # 说明: embedding 后端为预留扩展点（Searcher 接口），当前未实现。
  # 默认: lexical
  backend: lexical

  # 注入/返回的结果条数上限。默认: 6
  top_k: 6

  # 注入上下文块的大小上限（估算 token）。默认: 800
  max_tokens: 800

# ---------------------------------------------------------------------------
# 本文件未覆盖、但运行时会用到的路径（非 YAML 配置，仅说明）
# ---------------------------------------------------------------------------
# <workspace>/AGENTS.md          层级项目指令（Phase 8）
# <workspace>/skills/<name>/SKILL.md  技能（Phase 9，/skill 手工激活）
# <workspace>/MEMORY.md          跨会话事实（Phase 11）
# 数据目录（由 data.location 决定）:
#   global    {home}/.mincode/projects/<project-id>/{traces,sessions,experiments}
#   workspace {workspace}/.mincode/{traces,sessions,experiments}
# Web UI: mincode web  — 静态资源 embed 自 web/dist（需先 npm run build）

